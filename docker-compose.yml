# Phase 3 用：云端数据库本地模拟（Neon/Supabase 的用户自行填 DATABASE_URL）
services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-workbench-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai_local_dev
      POSTGRES_DB: ai_workbench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
