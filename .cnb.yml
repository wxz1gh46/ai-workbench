# AI 工作台流水线
# 保留既有的 issue.comment@npc（NPC 触发），新增 push / pull_request 的校验与测试。
$:
  # NPC 触发：评论中 @npc 时唤起
  issue.comment@npc:
    - name: npc
      runner:
        cpus: 2                  # 内存 = CPU x 2G，即 2 核 4G
      docker:
        image: node:20
      stages:
        - name: npc
          script: echo runner 2cpu 4G

main:
  push:
    - name: verify
      runner:
        cpus: 4
      docker:
        image: node:20
      env:
        # 测试环境不配置任何模型密钥，验证「离线兜底」路径
        NODE_ENV: test
      stages:
        - name: install
          script: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@9.12.0 --activate
            pnpm install --no-frozen-lockfile

        - name: typecheck
          script: pnpm typecheck

        - name: test
          script: pnpm test

        - name: build-desktop
          script: pnpm --filter @ai/desktop build

  pull_request:
    - name: verify-pr
      runner:
        cpus: 4
      docker:
        image: node:20
      stages:
        - name: install
          script: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@9.12.0 --activate
            pnpm install --no-frozen-lockfile

        - name: typecheck
          script: pnpm typecheck

        - name: test
          script: pnpm test
