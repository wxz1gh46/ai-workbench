# AI 工作台流水线
# 保留既有的 issue.comment@npc（NPC 触发），新增 push / pull_request 的校验与测试。
$:
  # NPC 触发：评论中 @npc 时唤起
  issue.comment@npc:
    - name: npc
      runner:
        cpus: 2                  # 内存 = CPU x 2G，即 2 核 4G
      docker:
        image: node:22
      stages:
        - name: npc
          script: echo runner 2cpu 4G

main:
  push:
    - name: verify
      runner:
        cpus: 4
      docker:
        image: node:22
      env:
        # 测试环境不配置任何模型密钥，验证「离线兜底」路径
        NODE_ENV: test
      stages:
        - name: install
          script: |
            bash -lc '
              set -euo pipefail
              corepack enable
              corepack prepare pnpm@9.12.0 --activate
              # 必须严格按 pnpm-lock.yaml 安装：
              # 锁文件里 better-sqlite3 固定在 13.0.3（修复了原生 finalizer 断言崩溃），
              # 一旦回退到 11.x，node --test 退出阶段会概率性 SIGABRT
              # （Assertion failed: (env) != nullptr，DECISIONS.md 决策 7）。
              pnpm install --frozen-lockfile
            '

        - name: typecheck
          script: pnpm typecheck

        - name: test
          script: pnpm test

        - name: verify-rollback
          script: pnpm --filter @ai/server verify:rollback && pnpm --filter @ai/server verify:phase4

        - name: build-desktop
          script: pnpm --filter @ai/desktop build

  pull_request:
    - name: verify-pr
      runner:
        cpus: 4
      docker:
        image: node:22
      stages:
        - name: install
          script: |
            bash -lc '
              set -euo pipefail
              corepack enable
              corepack prepare pnpm@9.12.0 --activate
              # 必须严格按 pnpm-lock.yaml 安装：
              # 锁文件里 better-sqlite3 固定在 13.0.3（修复了原生 finalizer 断言崩溃），
              # 一旦回退到 11.x，node --test 退出阶段会概率性 SIGABRT
              # （Assertion failed: (env) != nullptr，DECISIONS.md 决策 7）。
              pnpm install --frozen-lockfile
            '

        - name: typecheck
          script: pnpm typecheck

        - name: test
          script: pnpm test

        - name: verify-rollback
          script: pnpm --filter @ai/server verify:rollback && pnpm --filter @ai/server verify:phase4
