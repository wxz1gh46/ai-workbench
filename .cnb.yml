# AI 工作台流水线与 CNB 平台配置
# 与 .github/workflows/ci.yml 保持同构：安装 -> 类型检查 -> 测试 -> 构建
# Node 必须 >= 22.6（测试使用 node:test 的 --experimental-transform-types）
$:
  # NPC 触发：评论中 @npc 时唤起
  issue.comment@npc:
    - name: npc
      runner:
        cpus: 2                  # 内存 = CPU x 2G，即 2 核 4G
      docker:
        image: node:22
      stages:
        - name: npc
          script: echo runner 2cpu 4G

main:
  push:
    - name: verify
      runner:
        cpus: 4
      docker:
        image: node:22
      env:
        # 测试环境不配置任何模型密钥，验证「离线兜底」路径
        NODE_ENV: test
      stages:
        - name: install
          script: |
            bash -lc '
              set -euo pipefail
              corepack enable
              corepack prepare pnpm@9.12.0 --activate
              pnpm install --frozen-lockfile
            '

        - name: typecheck
          script: pnpm typecheck

        - name: test
          script: pnpm test

        - name: secret-scan
          script: |
            bash -lc '
              set -euo pipefail
              patterns="(sk-[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{12,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)"
              hits="$(grep -rEIln "$patterns" . \
                --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=target \
                --exclude="*.test.ts" --exclude="*.test.tsx" \
                --exclude="DECISIONS.md" --exclude="CHANGELOG.md" --exclude="SECURITY.md" --exclude="CONTRIBUTING.md" \
                || true)"
              if [ -n "$hits" ]; then
                echo "❌ 发现疑似硬编码凭据："; echo "$hits"; exit 1
              fi
              echo "✅ 未发现疑似凭据"
            '

        - name: build-desktop
          script: pnpm --filter @ai/desktop build

  pull_request:
    - name: verify-pr
      runner:
        cpus: 4
      docker:
        image: node:22
      env:
        NODE_ENV: test
      stages:
        - name: install
          script: |
            bash -lc '
              set -euo pipefail
              corepack enable
              corepack prepare pnpm@9.12.0 --activate
              pnpm install --frozen-lockfile
            '

        - name: typecheck
          script: pnpm typecheck

        - name: test
          script: pnpm test
